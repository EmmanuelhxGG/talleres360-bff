# BFF Talleres360 (VM ec2-bff)
# Uso: docker compose up -d --build
# Configuracion privada en .env: Azure, URLs de los tres microservicios y clave interna.
#
# El BFF expone 8080 como destino del API Gateway. Cada microservicio vive en su propia EC2
# y se llama por su IP privada: Ordenes 8081, Catalogo 8082 y Reporteria 8083.

services:
  bff:
    build: .
    image: talleres360/ms-bff:latest
    container_name: ms-talleres360-bff
    ports:
      - "8080:8080"
    environment:
      TZ: America/Santiago
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      API_CLIENT_ID: ${API_CLIENT_ID}
      ORDERS_URL: ${ORDERS_URL}
      CATALOG_URL: ${CATALOG_URL}
      REPORT_URL: ${REPORT_URL}
      NOTIFICATIONS_URL: ${NOTIFICATIONS_URL:?Configura la URL privada de Notificaciones en .env}
      AUDIT_URL: ${AUDIT_URL:?Configura la URL privada de Auditoria en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # DEBUG para diagnosticar 401/403 (ver las authorities del token)
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${SECURITY_LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    restart: unless-stopped
